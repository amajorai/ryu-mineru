# GENERATED by tools/mirror-satellites.sh — edit there, not here.
name: canary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canary
  cancel-in-progress: true

jobs:
  # HISTORY IS KEPT (changed 2026-08-04). This used to delete the `canary` release
  # and its tag on every run and recreate one rolling release, so the channel only
  # ever held the newest build and every earlier one was destroyed. Each build now
  # publishes under its own versioned tag and the last $RETAIN are kept.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        name: Create this canary prerelease, then prune old ones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          RETAIN: "10"
          # Optional. Unset = the changelog is the raw mirror-commit bullets,
          # which is already real content; set, they are merged into highlights.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          # This build's own version: <base>-canary.<utc-date>.<run-number>, where the
          # base is the in-tree version advanced past any published stable release.
          # Ordered by semver precedence, so two rolling builds are comparable and a
          # prerelease always ranks below its finished stable.
          VERSION="$(node scripts/next-version.mjs canary --in-tree 0.2.6)"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Canary version: $VERSION (tag $TAG)"
          {
            printf '## Canary `%s`\n\n' "$VERSION"
            printf 'Rolling **canary** build of `ryu-mineru` from `main` — not a stable release.\n\n'
            printf 'Built from commit %s.\n\n' "${GITHUB_SHA}"
            printf 'Installed Ryu nodes never auto-update onto rolling builds; the updater only\n'
            printf 'tracks the latest tagged v* release. Use the tagged releases for anything real.\n'
          } > notes.md
          # Banner above, real changelog here. Read from this repo's own mirror
          # commit bodies; never fails the build.
          node scripts/rolling-notes.mjs --channel canary --repo "$GITHUB_REPOSITORY" >> notes.md
          # The tag now CARRIES the version, so `release_version` (apps/core/src/update/mod.rs)
          # reads it off the tag and only falls back to scanning this title. The title
          # keeps its shape regardless: it is what a human reads, and it is still the
          # fallback. --prerelease is load-bearing — `/releases/latest` excludes
          # prereleases, which is what keeps stable nodes off rolling builds.
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "Canary $VERSION (${GITHUB_SHA:0:12})" --notes-file notes.md
          # Keep the newest $RETAIN builds on this channel; delete the rest with their
          # tags. Matching the tag SHAPE means this can never touch a v* stable release.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --exclude-drafts \
            --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-canary\\."))]
                  | sort_by(.createdAt) | reverse | .['"$RETAIN"':][] | .tagName' \
            > stale.txt || true
          while read -r old; do
            [ -n "$old" ] || continue
            echo "pruning old canary release $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done < stale.txt
          # Retire the pre-2026-08-04 unversioned rolling release once.
          gh release delete canary --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

  build:
    needs: prepare
    name: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        working-directory: sidecar
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out && cp sidecar/dist/* out/ || true
          ( cd out && for f in *; do
              if command -v sha256sum >/dev/null 2>&1; then sha256sum "$f" > "$f.sha256"; fi
            done ) || true
          ls -la out || true
      # gh release upload, NOT softprops: softprops PATCHes the release even
      # when it is only ADDING assets, and that PATCH is refused for the App
      # token ("Resource not accessible by integration") despite Contents:
      # write. The assets endpoint on its own is permitted.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*)
          if [ ${#files[@]} -eq 0 ]; then
            # Fail loudly: the wheel + sdist build always produces artifacts, so
            # an empty match is a genuine build failure — never a legitimate skip.
            # (`exit 0` here once let a release ship with no assets.)
            echo "no files matched" >&2; exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
